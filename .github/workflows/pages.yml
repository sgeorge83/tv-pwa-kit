# Publish the static PWA to the gh-pages branch.
# This does not use actions/configure-pages (that API 404s until Pages is
# turned on). After the gh-pages branch exists:
#   Settings → Pages → Source: Deploy from a branch → gh-pages → / (root)

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stage static site
        run: |
          mkdir -p _site/.well-known _site/assets _site/usb _site/docs
          cp index.html kit.html style.css script.js manifest.json sw.js sw-register.js \
            favicon.png icon.png icon1.png screenshot-wide.png screenshot-mobile.png _site/
          cp -r assets/. _site/assets/
          cp usb/launch.html _site/launch.html
          cp usb/launch.html usb/README-USB.txt _site/usb/
          cp docs/ANDROID-TV-APK.md docs/GITHUB-UPLOAD.md _site/docs/
          cp .well-known/assetlinks.json _site/.well-known/
          touch _site/.nojekyll

      - name: Push gh-pages branch
        working-directory: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git checkout -B gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Deploy site from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
