# Deploy to GitHub Pages (static PWA, no Vite build).
#
# First run fails until Pages is enabled (the default GITHUB_TOKEN cannot
# create a Pages site). In the repo: Settings → Pages → Source → GitHub Actions.
# Then re-run this workflow from the Actions tab.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stage static site
        run: |
          mkdir -p _site/.well-known _site/assets _site/usb _site/docs
          cp index.html kit.html style.css script.js manifest.json sw.js sw-register.js \
            favicon.png icon.png icon1.png screenshot-wide.png screenshot-mobile.png _site/
          cp -r assets/. _site/assets/
          cp usb/launch.html _site/launch.html
          cp usb/launch.html usb/README-USB.txt _site/usb/
          cp docs/ANDROID-TV-APK.md docs/GITHUB-UPLOAD.md _site/docs/
          cp .well-known/assetlinks.json _site/.well-known/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
